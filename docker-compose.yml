# Local test stack only: PostgreSQL and a demo IBM MQ queue manager.
# The app itself runs from the IDE or `mvn spring-boot:run`; see README "Quick start".
# Every value below is a demo value. Do not use them anywhere real.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mqmonitor
      POSTGRES_USER: mqmonitor
      POSTGRES_PASSWORD: mqmonitor
    # Host port 5433 (container 5432) so it does not clash with a local PostgreSQL on 5432.
    # application.yml defaults to jdbc:postgresql://localhost:5433/mqmonitor, so a local run needs no override.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mqmonitor -d mqmonitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  ibmmq:
    image: icr.io/ibm-messaging/mq:latest
    # The image has no arm64 build; this runs it under emulation on Apple Silicon.
    platform: linux/amd64
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_ADMIN_PASSWORD: passw0rd
      MQ_APP_PASSWORD: passw0rd
    ports:
      - "1414:1414"   # client channel DEV.ADMIN.SVRCONN
      - "9443:9443"   # MQ Console, https://localhost:9443/ibmmq/console (admin / passw0rd)
    healthcheck:
      test: ["CMD", "dspmq", "-m", "QM1"]
      interval: 10s
      timeout: 5s
      retries: 12
