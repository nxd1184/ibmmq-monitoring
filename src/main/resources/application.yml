spring:
  application:
    name: ibmmq-monitoring-tool
  # Defaults match the Postgres in docker-compose.yml (host port 5433). Override with
  # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD in any other environment.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mqmonitor}
    username: ${SPRING_DATASOURCE_USERNAME:mqmonitor}
    password: ${SPRING_DATASOURCE_PASSWORD:mqmonitor}
  flyway:
    enabled: true

# The MQ starter would otherwise build a connection factory from ibm.mq.* properties;
# this tool builds one per stored connection instead.
ibm:
  mq:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  # The JMS health indicator would try the default queue manager at localhost:1414 and
  # mark the app DOWN. Queue managers are monitored per connection, not as app health.
  health:
    jms:
      enabled: false
  # Prometheus shows MQ series only; see MetricsConfig for the matching MeterFilter.
  metrics:
    enable:
      all: false
      ibmmq: true

mqmonitor:
  # Secrets come from the environment. An empty fallback keeps a missing variable a
  # bind-validation failure (clear message) instead of a placeholder resolution error.
  admin:
    username: ${MQMONITOR_ADMIN_USERNAME:}
    password: ${MQMONITOR_ADMIN_PASSWORD:}
  encryption-key: ${MQMONITOR_ENCRYPTION_KEY:}
  sampling:
    watcher-grace-seconds: 30
    list-interval-seconds: 30
  thresholds:
    depth-percent: 80
    no-consumer-seconds: 60
  mq:
    connect-timeout-seconds: 10
