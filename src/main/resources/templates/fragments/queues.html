<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="content" class="queues">
  <h2>Queues</h2>
  <p th:if="${queues.isEmpty()}">No queues in this sample.</p>
  <table th:unless="${queues.isEmpty()}">
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Depth</th>
        <th scope="col">Max depth</th>
        <th scope="col">Open input</th>
        <th scope="col">Open output</th>
        <th scope="col">Oldest message age</th>
        <th scope="col">Last put</th>
        <th scope="col">Last get</th>
        <th scope="col">Health</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="q : ${queues}" th:with="v=${sample.queues[q.name]}">
        <th scope="row" th:text="${q.name}">DEV.Q1</th>
        <td th:text="${q.depth}">0</td>
        <td th:text="${q.maxDepth}">5000</td>
        <td th:text="${fmt.num(q.openInputCount)}">0</td>
        <td th:text="${fmt.num(q.openOutputCount)}">0</td>
        <td th:text="${fmt.age(q.oldestMessageAgeSeconds)}">0s</td>
        <td th:text="${fmt.time(q.lastPut)}">n/a</td>
        <td th:text="${fmt.time(q.lastGet)}">n/a</td>
        <td th:class="${fmt.healthClass(v)}" th:title="${fmt.reason(v)}"
            th:text="${fmt.healthText(v)}">healthy</td>
      </tr>
    </tbody>
  </table>
</section>
</body>
</html>
