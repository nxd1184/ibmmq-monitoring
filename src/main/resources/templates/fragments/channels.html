<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="content" class="card channels">
  <div class="card-header">
    <h2>Channels <span class="count" th:text="${#lists.size(sample.sample.channels)}">1</span></h2>
  </div>
  <p th:if="${#lists.isEmpty(sample.sample.channels)}" class="waiting">No channels in this sample.</p>
  <div class="table-wrap" th:unless="${#lists.isEmpty(sample.sample.channels)}">
    <table class="data-table">
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Type</th>
          <th scope="col">Status</th>
          <th scope="col">Health</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="ch : ${sample.sample.channels}" th:with="v=${sample.channels[ch.name]}">
          <th scope="row" class="ident" th:text="${ch.name}">DEV.APP.SVRCONN</th>
          <td th:text="${fmt.text(ch.type)}">SVRCONN</td>
          <td th:text="${fmt.text(ch.status)}">RUNNING</td>
          <td th:class="${fmt.healthClass(v)}" th:title="${fmt.reason(v)}"><span class="status"><svg class="dot" width="8" height="8" viewBox="0 0 8 8" aria-hidden="true" focusable="false"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg><span th:text="${fmt.healthText(v)}">healthy</span></span><span class="cell-reason" th:if="${fmt.healthClass(v) == 'health-unhealthy'}" th:text="${fmt.reason(v)}">reason</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</body>
</html>
