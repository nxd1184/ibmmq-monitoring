<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${pageTitle}, ~{::main})}">
<body>
<main class="page connection-form">
  <div class="page-header">
    <div>
      <p class="breadcrumb"><a th:href="@{/connections}">Connections</a> /</p>
      <h1 th:text="${pageTitle}">New connection</h1>
    </div>
  </div>
  <form method="post" class="card form-card"
        th:action="${connectionForm.id == null} ? @{/connections} : @{/connections/{id}(id=${connectionForm.id})}"
        th:object="${connectionForm}">
    <ul class="error" th:if="${#fields.hasGlobalErrors()}" role="alert">
      <li th:each="e : ${#fields.globalErrors()}" th:text="${e}">error</li>
    </ul>
    <input type="hidden" th:field="*{id}">
    <div class="form-grid">
      <p class="field">
        <label for="name">Name<span class="req" aria-hidden="true">*</span></label>
        <input type="text" th:field="*{name}" required>
        <span class="error" th:errors="*{name}"></span>
      </p>
      <p class="field">
        <label for="queueManager">Queue manager<span class="req" aria-hidden="true">*</span></label>
        <input type="text" th:field="*{queueManager}" required>
        <span class="error" th:errors="*{queueManager}"></span>
      </p>
      <p class="field">
        <label for="host">Host<span class="req" aria-hidden="true">*</span></label>
        <input type="text" th:field="*{host}" required>
        <span class="error" th:errors="*{host}"></span>
      </p>
      <p class="field">
        <label for="port">Port<span class="req" aria-hidden="true">*</span></label>
        <input type="number" th:field="*{port}" min="1" max="65535" required>
        <span class="error" th:errors="*{port}"></span>
      </p>
      <p class="field">
        <label for="channel">Channel<span class="req" aria-hidden="true">*</span></label>
        <input type="text" th:field="*{channel}" required>
        <span class="error" th:errors="*{channel}"></span>
      </p>
      <p class="field">
        <label for="clientType">Client type</label>
        <select th:field="*{clientType}">
          <option th:each="t : ${clientTypes}" th:value="${t}" th:text="${t}">NATIVE</option>
        </select>
      </p>
      <p class="field">
        <label for="username">Username</label>
        <input type="text" th:field="*{username}" autocomplete="off">
        <span class="error" th:errors="*{username}"></span>
      </p>
      <p class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" value="" autocomplete="new-password">
        <small class="hint" th:if="${connectionForm.id != null}">leave blank to keep the current password</small>
      </p>
      <p class="field">
        <label for="tlsMode">TLS mode</label>
        <select th:field="*{tlsMode}"
                hx-get="/connections/tls-fields"
                hx-include="[name='tlsMode'],[name='cipherSpec'],[name='truststorePath'],[name='keystorePath'],[name='certificateLabel']"
                hx-target="#tls-fields" hx-trigger="change">
          <option th:each="t : ${tlsModes}" th:value="${t}" th:text="${t}">NONE</option>
        </select>
      </p>
    </div>
    <fieldset id="tls-fields" class="tls-fieldset" th:insert="~{fragments/tls-fields :: fields}"></fieldset>
    <details class="advanced" th:open="${#fields.hasErrors('queueFilter') or #fields.hasErrors('sampleIntervalSeconds') or #fields.hasErrors('replyQueueModel')}">
      <summary>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6"/></svg>
        Advanced
        <span class="hint">sampling, filters and health thresholds</span>
      </summary>
      <div class="form-grid">
        <p class="field">
          <label for="queueFilter">Queue filter</label>
          <input type="text" th:field="*{queueFilter}" placeholder="*">
          <span class="error" th:errors="*{queueFilter}"></span>
        </p>
        <p class="field">
          <label for="sampleIntervalSeconds">Sample interval (seconds)</label>
          <input type="number" th:field="*{sampleIntervalSeconds}" min="1">
          <span class="error" th:errors="*{sampleIntervalSeconds}"></span>
        </p>
        <p class="field">
          <label class="check"><input type="checkbox" th:field="*{hideSystemQueues}"> Hide system queues</label>
        </p>
        <p class="field">
          <label class="check"><input type="checkbox" th:field="*{prometheusExport}"> Prometheus export</label>
        </p>
        <p class="field">
          <label for="replyQueueModel">Reply queue model</label>
          <input type="text" th:field="*{replyQueueModel}">
          <span class="error" th:errors="*{replyQueueModel}"></span>
        </p>
        <p class="field">
          <label for="thresholdDepthMax">Depth max</label>
          <input type="number" th:field="*{thresholdDepthMax}" th:placeholder="${thresholdDefaults.depthMax}">
        </p>
        <p class="field">
          <label for="thresholdDepthPercent">Depth percent</label>
          <input type="number" th:field="*{thresholdDepthPercent}" th:placeholder="${thresholdDefaults.depthPercent}">
        </p>
        <p class="field">
          <label for="thresholdNoConsumerSeconds">No consumer (seconds)</label>
          <input type="number" th:field="*{thresholdNoConsumerSeconds}" th:placeholder="${thresholdDefaults.noConsumerSeconds}">
        </p>
        <p class="field">
          <label for="thresholdOldestMessageAgeSeconds">Oldest message age (seconds)</label>
          <input type="number" th:field="*{thresholdOldestMessageAgeSeconds}" th:placeholder="${thresholdDefaults.oldestMessageAgeSeconds}">
        </p>
      </div>
    </details>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <button type="button" class="btn btn-secondary" hx-post="/connections/test" hx-include="closest form" hx-target="#test-result">Test connection</button>
      <a class="btn btn-link" href="/connections" th:href="@{/connections}">Cancel</a>
    </div>
    <div id="test-result" aria-live="polite"></div>
  </form>
</main>
</body>
</html>
