<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${connection.name}, ~{::main})}">
<body>
<main class="dashboard">
  <h1 th:text="${connection.name}">Connection</h1>
  <p>
    <span th:text="|${connection.host}:${connection.port}|">host:1414</span>,
    queue manager <span th:text="${connection.queueManager}">QM1</span>
  </p>
  <p>
    <a th:href="@{/connections/{id}(id=${connection.id},showSystem=${!showSystem})}"
       th:text="${showSystem} ? 'Hide system queues' : 'Show system queues'">Show system queues</a>
  </p>
  <div hx-ext="sse"
       th:sse-connect="${showSystem}
           ? @{/connections/{id}/stream(id=${connection.id},showSystem=true)}
           : @{/connections/{id}/stream(id=${connection.id})}">
    <div sse-swap="qmgr">
      <p th:if="${latest == null}" class="waiting">Waiting for first sample&hellip;</p>
      <th:block th:if="${latest != null}" th:utext="${fragments['qmgr']}"></th:block>
    </div>
    <div sse-swap="queues">
      <th:block th:if="${latest != null}" th:utext="${fragments['queues']}"></th:block>
    </div>
    <div sse-swap="channels">
      <th:block th:if="${latest != null}" th:utext="${fragments['channels']}"></th:block>
    </div>
  </div>
</main>
</body>
</html>
